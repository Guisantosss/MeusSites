<!doctype html>
<!-- Arte da imagem de compartilhamento (1200x630). Gerada por scripts/og.py em public/img/og.jpg. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Instrument Serif"; src: url("../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2") format("woff2"); }
  @font-face { font-family: "Inter Tight"; src: url("../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2") format("woff2-variations"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #000; overflow: hidden; }

  .bg::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, #000 0%, #000 26%, rgba(0,0,0,.55) 48%, rgba(0,0,0,0) 70%), linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,0) 30%); }
  .txt { position: absolute; left: 72px; bottom: 80px; color: #F2EADF; }
  h1 { margin: 0; font: 400 172px/0.82 "Instrument Serif", serif; letter-spacing: -0.025em; }
  p { margin: 22px 0 0; font: italic 400 40px/1.1 "Instrument Serif", serif; }
  small { display: block; margin-top: 30px; font: 500 18px/1 "Inter Tight", sans-serif; color: #9C9187; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="txt">

    <small>Site vitrine criado pela Icreativa</small>
  </div>
</body>
</html>
